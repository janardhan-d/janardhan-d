<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 160" width="1280" height="160">
  <defs>
    <linearGradient id="stBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060813"/>
      <stop offset="100%" stop-color="#0d1124"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#stBg)" rx="20"/>

  <g transform="translate(190, 20)">
    <rect width="900" height="120" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.6"/>

    <!-- Left: Total Contributions -->
    <g transform="translate(150, 45)" text-anchor="middle">
      <text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff">91</text>
      <text y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#a78bfa">Total Contributions</text>
      <text y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">Jan 12, 2025 - Present</text>
    </g>

    <line x1="300" y1="20" x2="300" y2="100" stroke="#21262d" stroke-width="1.5"/>

    <!-- Center: Current Streak with Glowing Fire Icon -->
    <g transform="translate(450, 60)" text-anchor="middle">
      <!-- Outer Flame Circle -->
      <circle cx="0" cy="-8" r="30" fill="none" stroke="#00f2fe" stroke-width="4">
        <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff">🔥 1</text>
      <text y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#00f2fe">Current Streak</text>
    </g>

    <line x1="600" y1="20" x2="600" y2="100" stroke="#21262d" stroke-width="1.5"/>

    <!-- Right: Longest Streak -->
    <g transform="translate(750, 45)" text-anchor="middle">
      <text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff">2</text>
      <text y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#a78bfa">Longest Streak</text>
      <text y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">May 29 - May 30</text>
    </g>
  </g>
</svg>