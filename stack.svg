<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17"/>
      <stop offset="100%" stop-color="#090a10"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16"/>

  <text x="640" y="55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="url(#title-grad)" text-anchor="middle" filter="url(#glow)">⚡ TECH ARSENAL &amp; CAPABILITIES</text>

  <!-- Row 1: Languages -->
  <g transform="translate(60, 110)">
    <text x="0" y="25" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#22d3ee">Languages</text>
    <g transform="translate(220, 0)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
      <rect x="0" y="0" width="95" height="38" rx="19" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="47.5" y="24" fill="#f8fafc" text-anchor="middle">Python</text>

      <rect x="110" y="0" width="80" height="38" rx="19" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="150" y="24" fill="#f8fafc" text-anchor="middle">Java</text>

      <rect x="205" y="0" width="115" height="38" rx="19" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="262.5" y="24" fill="#f8fafc" text-anchor="middle">JavaScript</text>

      <rect x="335" y="0" width="75" height="38" rx="19" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="372.5" y="24" fill="#f8fafc" text-anchor="middle">SQL</text>

      <rect x="425" y="0" width="60" height="38" rx="19" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="455" y="24" fill="#f8fafc" text-anchor="middle">C</text>

      <rect x="500" y="0" width="85" height="38" rx="19" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="542.5" y="24" fill="#f8fafc" text-anchor="middle">HTML5</text>

      <rect x="600" y="0" width="80" height="38" rx="19" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="640" y="24" fill="#f8fafc" text-anchor="middle">CSS3</text>

      <rect x="695" y="0" width="115" height="38" rx="19" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="752.5" y="24" fill="#f8fafc" text-anchor="middle">TypeScript</text>
    </g>
  </g>

  <!-- Row 2: Frameworks & Web -->
  <g transform="translate(60, 200)">
    <text x="0" y="25" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#a78bfa">Frameworks &amp; Web</text>
    <g transform="translate(220, 0)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
      <rect x="0" y="0" width="85" height="38" rx="19" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="42.5" y="24" fill="#f8fafc" text-anchor="middle">React</text>

      <rect x="100" y="0" width="95" height="38" rx="19" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="147.5" y="24" fill="#f8fafc" text-anchor="middle">Node.js</text>

      <rect x="210" y="0" width="95" height="38" rx="19" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="257.5" y="24" fill="#f8fafc" text-anchor="middle">Next.js</text>

      <rect x="320" y="0" width="105" height="38" rx="19" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="372.5" y="24" fill="#f8fafc" text-anchor="middle">Express.js</text>

      <rect x="440" y="0" width="125" height="38" rx="19" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="502.5" y="24" fill="#f8fafc" text-anchor="middle">Tailwind CSS</text>

      <rect x="580" y="0" width="85" height="38" rx="19" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="622.5" y="24" fill="#f8fafc" text-anchor="middle">Redux</text>
    </g>
  </g>

  <!-- Row 3: AI / Data & Tools -->
  <g transform="translate(60, 290)">
    <text x="0" y="25" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#34d399">AI, Data &amp; Tools</text>
    <g transform="translate(220, 0)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
      <rect x="0" y="0" width="120" height="38" rx="19" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
      <text x="60" y="24" fill="#f8fafc" text-anchor="middle">TensorFlow</text>

      <rect x="135" y="0" width="115" height="38" rx="19" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
      <text x="192.5" y="24" fill="#f8fafc" text-anchor="middle">Scikit-Learn</text>

      <rect x="265" y="0" width="95" height="38" rx="19" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
      <text x="312.5" y="24" fill="#f8fafc" text-anchor="middle">Tableau</text>

      <rect x="375" y="0" width="95" height="38" rx="19" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
      <text x="422.5" y="24" fill="#f8fafc" text-anchor="middle">PowerBI</text>

      <rect x="485" y="0" width="105" height="38" rx="19" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
      <text x="537.5" y="24" fill="#f8fafc" text-anchor="middle">MongoDB</text>

      <rect x="605" y="0" width="110" height="38" rx="19" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
      <text x="660" y="24" fill="#f8fafc" text-anchor="middle">PostgreSQL</text>

      <rect x="730" y="0" width="65" height="38" rx="19" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
      <text x="762.5" y="24" fill="#f8fafc" text-anchor="middle">Git</text>
    </g>
  </g>
</svg>