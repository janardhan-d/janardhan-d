<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 230" width="1280" height="230">
  <defs>
    <linearGradient id="sBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060813"/>
      <stop offset="100%" stop-color="#0d1124"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <style>
    .metric-panel {
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
      transform-box: fill-box;
      transform-origin: center;
    }
    .metric-panel:hover {
      transform: translateY(-4px);
      filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.3));
    }
    .metric-panel:hover rect {
      stroke: #38bdf8;
    }
  </style>

  <rect width="100%" height="100%" fill="url(#sBg)" rx="20"/>

  <!-- LEFT CARD -->
  <g class="metric-panel" transform="translate(40, 25)">
    <rect width="575" height="180" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.6"/>
    
    <text x="30" y="35" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#cyanGrad)">Janardhan's GitHub Metrics</text>
    <line x1="30" y1="48" x2="545" y2="48" stroke="#21262d" stroke-width="1"/>

    <g transform="translate(30, 75)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">
      <text y="0"><tspan fill="#a78bfa">★</tspan> Total Stars Earned: <tspan fill="#ffffff" font-weight="bold">5+</tspan></text>
      <text y="28"><tspan fill="#00f2fe">⚡</tspan> Total Commits: <tspan fill="#ffffff" font-weight="bold">90+</tspan></text>
      <text y="56"><tspan fill="#34d399">📦</tspan> Total Repositories: <tspan fill="#ffffff" font-weight="bold">9</tspan></text>
      <text y="84"><tspan fill="#f472b6">🔄</tspan> Contributed to: <tspan fill="#ffffff" font-weight="bold">6 Repos</tspan></text>
    </g>

    <!-- Rank Ring A+ -->
    <g transform="translate(460, 110)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#21262d" stroke-width="6"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#00f2fe" stroke-width="6" stroke-dasharray="264" stroke-dashoffset="35" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" values="264;35" dur="1.8s" fill="freeze"/>
      </circle>
      <text x="0" y="10" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#00f2fe" text-anchor="middle">A+</text>
      <text x="0" y="25" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#94a3b8" text-anchor="middle">RANK</text>
    </g>
  </g>

  <!-- RIGHT CARD -->
  <g class="metric-panel" transform="translate(665, 25)">
    <rect width="575" height="180" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.6"/>
    
    <text x="30" y="35" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#purpleGrad)">Most Used Languages</text>
    <line x1="30" y1="48" x2="545" y2="48" stroke="#21262d" stroke-width="1"/>

    <g transform="translate(30, 68)">
      <rect width="515" height="12" rx="6" fill="#21262d"/>
      <rect width="275" height="12" rx="6" fill="#3b82f6"/>
      <rect x="275" width="180" height="12" fill="#f59e0b"/>
      <rect x="455" width="60" height="12" rx="6" fill="#10b981"/>
    </g>

    <g transform="translate(30, 110)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">
      <circle cx="6" cy="0" r="5" fill="#3b82f6"/>
      <text x="18" y="4">Python <tspan fill="#ffffff" font-weight="bold">53.5%</tspan></text>

      <circle cx="156" cy="0" r="5" fill="#f59e0b"/>
      <text x="168" y="4">JavaScript <tspan fill="#ffffff" font-weight="bold">41.5%</tspan></text>

      <circle cx="316" cy="0" r="5" fill="#10b981"/>
      <text x="328" y="4">HTML/CSS <tspan fill="#ffffff" font-weight="bold">5.0%</tspan></text>
    </g>

    <g transform="translate(30, 140)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">
      <text y="4">Total 9 Active Repositories • 100% Autonomous Local Rendering</text>
    </g>
  </g>
</svg>