<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340">
  <defs>
    <linearGradient id="dbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e"/>
      <stop offset="50%" stop-color="#0b0e1a"/>
      <stop offset="100%" stop-color="#080a14"/>
    </linearGradient>
    <linearGradient id="dashGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b26"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="340" fill="url(#dbg)" rx="20"/>

  <!-- Top Accent Border -->
  <rect x="0" y="0" width="1280" height="4" rx="2" fill="url(#dashGold)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Main Unified Card -->
  <g transform="translate(30, 20)">
    <rect width="1220" height="300" rx="16" fill="#0d1117" stroke="#2b2313" stroke-width="1.8">
      <animate attributeName="stroke" values="#2b2313;#ffd700;#2b2313" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- Header Bar -->
    <text x="35" y="42" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="900" fill="url(#dashGold)">
      &#x26A1; EXECUTIVE DASHBOARD &amp; KEY METRICS
    </text>

    <!-- Verified Badge -->
    <g transform="translate(1010, 26)">
      <rect width="175" height="26" rx="13" fill="#0d2a1a" stroke="#34d399" stroke-width="1.2"/>
      <circle cx="16" cy="13" r="4" fill="#34d399">
        <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="17" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" fill="#34d399">LEVEL 3 VERIFIED</text>
    </g>

    <line x1="35" y1="58" x2="1185" y2="58" stroke="#21262d" stroke-width="1.5"/>

    <!-- 4 Metric Cards Across (No duplicate photos or names!) -->
    <!-- Card 1: Public Repos (Gold) -->
    <g transform="translate(35, 75)">
      <rect width="265" height="105" rx="14" fill="url(#boxBg)" stroke="#ffd700" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <text x="132" y="44" font-family="ui-monospace,Consolas,monospace" font-size="36" font-weight="900" fill="#ffd700" text-anchor="middle">
        9+
        <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
      </text>
      <text x="132" y="72" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">Public Repositories</text>
      <text x="132" y="92" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Open-Source &amp; AI Builds</text>
    </g>

    <!-- Card 2: Annual Contributions (Cyan) -->
    <g transform="translate(325, 75)">
      <rect width="265" height="105" rx="14" fill="url(#boxBg)" stroke="#00f2fe" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="132" y="44" font-family="ui-monospace,Consolas,monospace" font-size="36" font-weight="900" fill="#00f2fe" text-anchor="middle">
        150+
        <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
      </text>
      <text x="132" y="72" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">Annual Contributions</text>
      <text x="132" y="92" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Commits, PRs &amp; Reviews</text>
    </g>

    <!-- Card 3: Internships (Emerald) -->
    <g transform="translate(615, 75)">
      <rect width="265" height="105" rx="14" fill="url(#boxBg)" stroke="#34d399" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
      </rect>
      <text x="132" y="44" font-family="ui-monospace,Consolas,monospace" font-size="36" font-weight="900" fill="#34d399" text-anchor="middle">
        3+
        <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
      </text>
      <text x="132" y="72" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">Industry Internships</text>
      <text x="132" y="92" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">TCS, InnoByte, SyntecxHub</text>
    </g>

    <!-- Card 4: Hackathon Wins (Amber / Rose) -->
    <g transform="translate(905, 75)">
      <rect width="280" height="105" rx="14" fill="url(#boxBg)" stroke="#fbbf24" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <text x="140" y="44" font-family="ui-monospace,Consolas,monospace" font-size="36" font-weight="900" fill="#fbbf24" text-anchor="middle">
        2+
        <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
      </text>
      <text x="140" y="72" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">Hackathon Wins</text>
      <text x="140" y="92" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">SVC &amp; NRCM Finalist</text>
    </g>

    <!-- Bottom Industry Engagements Section -->
    <g transform="translate(35, 205)" font-family="Segoe UI,Helvetica,Arial,sans-serif">
      <text x="0" y="16" font-size="12" font-weight="800" fill="#94a3b8" letter-spacing="2">INDUSTRY ENGAGEMENTS &amp; VERIFIED EXPERIENCE</text>

      <!-- 3 Pill Badges -->
      <g transform="translate(0, 30)">
        <!-- Engagement 1 -->
        <rect x="0" y="0" width="375" height="42" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1.2"/>
        <text x="16" y="26" font-size="13" font-weight="700" fill="#ffd700">&#x25B8; TCS Forage Simulation:</text>
        <text x="180" y="26" font-size="13" fill="#cbd5e1">Tableau &amp; ESG Consulting</text>

        <!-- Engagement 2 -->
        <rect x="395" y="0" width="375" height="42" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1.2"/>
        <text x="411" y="26" font-size="13" font-weight="700" fill="#00f2fe">&#x25B8; InnoByte Services:</text>
        <text x="560" y="26" font-size="13" fill="#cbd5e1">Finance Manager Python App</text>

        <!-- Engagement 3 -->
        <rect x="790" y="0" width="360" height="42" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1.2"/>
        <text x="806" y="26" font-size="13" font-weight="700" fill="#34d399">&#x25B8; SyntecxHub Intern:</text>
        <text x="965" y="26" font-size="13" fill="#cbd5e1">Kanban &amp; AI Quiz Platforms</text>
      </g>
    </g>
  </g>
</svg>