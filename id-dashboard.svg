<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <style>
      .bg { fill: #0d0e16; }
      .card-bg { fill: rgba(255, 255, 255, 0.03); stroke: rgba(255, 255, 255, 0.1); stroke-width: 1.5; }
      .glow-border { stroke: url(#glow); stroke-width: 2; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 2px; fill: #00f0ff; }
      .name { font-family: system-ui, -apple-system, sans-serif; font-size: 38px; font-weight: 800; fill: #ffffff; }
      .handle { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 20px; fill: #8b949e; }
      .role { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 600; fill: url(#role-grad); }
      .status { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; fill: #c9d1d9; }
      .dot { fill: #2ea043; }
      .loc-lvl { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; fill: #8b949e; }
      
      .stat-card { fill: rgba(255, 255, 255, 0.05); stroke: rgba(255, 255, 255, 0.08); stroke-width: 1; }
      .stat-val { font-family: system-ui, -apple-system, sans-serif; font-size: 42px; font-weight: 800; fill: #ffffff; }
      .stat-label { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; fill: #8b949e; }
      .stat-icon { font-size: 24px; fill: #58a6ff; }
      
      /* Animations */
      @keyframes fade-in {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .animate-card { animation: fade-in 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
      .delay-1 { animation-delay: 0.2s; }
      .delay-2 { animation-delay: 0.4s; }
      .delay-3 { animation-delay: 0.6s; }
      .delay-4 { animation-delay: 0.8s; }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      .pulse-dot { animation: pulse 2s infinite; }
    </style>

    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff00f0" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="role-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#ff7b72" />
    </linearGradient>
    
    <linearGradient id="accent-1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ff7b72" /></linearGradient>
    <linearGradient id="accent-2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#79c0ff" /></linearGradient>
    <linearGradient id="accent-3" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#d2a8ff" /></linearGradient>
    <linearGradient id="accent-4" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a5d6ff" /></linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="420" class="bg" rx="12" />

  <!-- LEFT SIDE: DEVELOPER ID -->
  <g transform="translate(40, 40)" class="animate-card delay-1">
    <rect width="580" height="340" rx="16" class="card-bg glow-border" />
    <text x="40" y="50" class="title">DEVELOPER ID</text>
    
    <text x="40" y="110" class="name">Janardhan Devarala</text>
    <text x="40" y="145" class="handle">@janardhan-d</text>
    
    <text x="40" y="200" class="role">AI &amp; ML Engineer | Full Stack Dev</text>
    
    <g transform="translate(40, 240)">
      <circle cx="8" cy="-5" r="6" class="dot pulse-dot" />
      <text x="24" y="0" class="status">Open to work</text>
    </g>
    
    <text x="40" y="280" class="loc-lvl">📍 India</text>
    <text x="40" y="315" class="loc-lvl">lvl 3 — Building &amp; Learning</text>
  </g>

  <!-- RIGHT SIDE: DASHBOARD STATS -->
  <g transform="translate(660, 40)">
    <text x="0" y="30" class="title animate-card delay-1">DASHBOARD</text>
    
    <!-- Grid 2x2 -->
    <!-- Stat 1: Public Repos -->
    <g transform="translate(0, 60)" class="animate-card delay-1">
      <rect width="270" height="130" rx="12" class="stat-card" />
      <rect width="4" height="60" x="0" y="35" rx="2" fill="url(#accent-1)" />
      <text x="25" y="60" class="stat-val">9+</text>
      <text x="25" y="95" class="stat-label">Public Repos</text>
      <text x="220" y="60" class="stat-icon" font-family="system-ui">▣</text>
    </g>

    <!-- Stat 2: Technologies -->
    <g transform="translate(290, 60)" class="animate-card delay-2">
      <rect width="270" height="130" rx="12" class="stat-card" />
      <rect width="4" height="60" x="0" y="35" rx="2" fill="url(#accent-2)" />
      <text x="25" y="60" class="stat-val">5+</text>
      <text x="25" y="95" class="stat-label">Technologies</text>
      <text x="220" y="60" class="stat-icon" font-family="system-ui">◈</text>
    </g>

    <!-- Stat 3: Internships -->
    <g transform="translate(0, 210)" class="animate-card delay-3">
      <rect width="270" height="130" rx="12" class="stat-card" />
      <rect width="4" height="60" x="0" y="35" rx="2" fill="url(#accent-3)" />
      <text x="25" y="60" class="stat-val">3+</text>
      <text x="25" y="95" class="stat-label">Internships</text>
      <text x="220" y="60" class="stat-icon" font-family="system-ui">◆</text>
    </g>

    <!-- Stat 4: Hackathons -->
    <g transform="translate(290, 210)" class="animate-card delay-4">
      <rect width="270" height="130" rx="12" class="stat-card" />
      <rect width="4" height="60" x="0" y="35" rx="2" fill="url(#accent-4)" />
      <text x="25" y="60" class="stat-val">2+</text>
      <text x="25" y="95" class="stat-label">Hackathons</text>
      <text x="220" y="60" class="stat-icon" font-family="system-ui">◇</text>
    </g>
  </g>
</svg>
