  <!-- Main heading -->
  <text x="640" y="90" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="36" font-weight="900" fill="url(#cGrad)" text-anchor="middle" filter="url(#cGlow)">
    &#x1F4EC; Let&#39;s Connect &amp; Build Together
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2.5s" repeatCount="indefinite"/>
  </text>
  <filter id="cGlow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <text x="640" y="130" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">
    Always open to collaborations, hackathons, AI projects, and interesting conversations
  </text>

  <!-- Bottom border -->
  <rect x="0" y="196" width="1280" height="4" rx="2" fill="url(#cGrad)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="1s"/>
  </rect>
