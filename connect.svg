<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="200" viewBox="0 0 1280 200">
  <defs>
    <linearGradient id="textGrad" x1="20%" y1="0%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#fe5196" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#fe5196" stop-opacity="1" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>
    
    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 46px;
        font-weight: 800;
        fill: url(#textGrad);
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 20px;
        fill: #8b949e;
        font-weight: 400;
      }
      .particle {
        fill: #00f2fe;
        opacity: 0;
      }
      .particle-pink {
        fill: #fe5196;
        opacity: 0;
      }
      @keyframes float {
        0% { transform: translateY(0px) scale(0.5); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateY(-50px) scale(1.2); opacity: 0; }
      }
      .p1 { animation: float 4s infinite linear; }
      .p2 { animation: float 5.5s infinite linear 1s; }
      .p3 { animation: float 3.5s infinite linear 2s; }
      .p4 { animation: float 6s infinite linear 0.5s; }
      .p5 { animation: float 4.5s infinite linear 1.5s; }
      .p6 { animation: float 5s infinite linear 2.5s; }
      .p7 { animation: float 3s infinite linear 3s; }
      .p8 { animation: float 6.5s infinite linear 1.2s; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="200" fill="#0d0e16" />
  
  <!-- Decorative Top Line -->
  <rect x="140" y="0" width="1000" height="2" fill="url(#lineGrad)" />

  <!-- Particles -->
  <g>
    <circle cx="200" cy="150" r="2.5" class="particle p1" />
    <circle cx="350" cy="180" r="3" class="particle-pink p2" />
    <circle cx="850" cy="160" r="2" class="particle p3" />
    <circle cx="1050" cy="180" r="4" class="particle-pink p4" />
    <circle cx="120" cy="130" r="1.5" class="particle p5" />
    <circle cx="1150" cy="150" r="2.5" class="particle p6" />
    <circle cx="450" cy="120" r="1.5" class="particle-pink p7" />
    <circle cx="950" cy="190" r="3.5" class="particle p8" />
  </g>

  <!-- Content -->
  <text x="640" y="100" class="title" text-anchor="middle">💌 Let's Connect</text>
  <text x="640" y="150" class="subtitle" text-anchor="middle">Always open to collaborations, hackathons, and interesting conversations</text>
</svg>
