        <animateTransform attributeName="transform" type="translate" values="15 0;0 0" dur="0.5s" begin="0.9s" fill="freeze"/>
        <circle cx="35" cy="307" r="5" fill="#f59e0b">
          <animate attributeName="r" values="5;7;5" dur="2s" begin="0.9s" repeatCount="indefinite"/>
        </circle>
        <text x="53" y="312" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#f59e0b">TCS Forage Alum</text>
        <text x="53" y="332" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#cbd5e1">Tableau/PowerBI dashboards, business consulting</text>
      </g>
