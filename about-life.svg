        <text x="53" y="249" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#00f2fe">ESG Enthusiast</text>
        <text x="53" y="269" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#cbd5e1">Passionate about sustainability &amp; responsible AI</text>
      </g>
