<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17"/>
      <stop offset="100%" stop-color="#090a10"/>
    </linearGradient>
    <linearGradient id="left-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="right-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16"/>

  <!-- Left Card Container -->
  <g transform="translate(40, 40)">
    <rect width="580" height="400" rx="14" fill="#131722" stroke="#1e293b" stroke-width="1.5"/>
    <text x="35" y="55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="url(#left-title-grad)" filter="url(#glow)">&lt; What I Build /&gt;</text>
    
    <g transform="translate(35, 105)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e2e8f0">
      <text y="0"><tspan fill="#22d3ee" font-weight="bold">🤖 AI &amp; ML Models</tspan> — Generative AI &amp; Predictive Analytics</text>
      <text y="50"><tspan fill="#a78bfa" font-weight="bold">📊 Data Dashboards</tspan> — Interactive Tableau &amp; PowerBI</text>
      <text y="100"><tspan fill="#f472b6" font-weight="bold">💻 Full-Stack Apps</tspan> — React, Node.js, Python &amp; SQLite</text>
      <text y="150"><tspan fill="#34d399" font-weight="bold">🏆 Hackathon Solutions</tspan> — Fast prototypes under pressure</text>
      <text y="200"><tspan fill="#fbbf24" font-weight="bold">🔐 Personal Finance Systems</tspan> — Desktop &amp; Cloud Tools</text>
    </g>
  </g>

  <!-- Right Card Container -->
  <g transform="translate(660, 40)">
    <rect width="580" height="400" rx="14" fill="#131722" stroke="#1e293b" stroke-width="1.5"/>
    <text x="35" y="55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="url(#right-title-grad)" filter="url(#glow)">&gt; Life Beyond Code</text>

    <g transform="translate(35, 105)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e2e8f0">
      <text y="0"><tspan fill="#34d399" font-weight="bold">🎓 BTech CSE (AI)</tspan> — Audisankara College (2023–2027)</text>
      <text y="50"><tspan fill="#22d3ee" font-weight="bold">📜 Certifications</tspan> — Google Cloud GenAI &amp; Microsoft AI</text>
      <text y="100"><tspan fill="#a78bfa" font-weight="bold">🏢 Internships</tspan> — InnoByte Services &amp; SyntecxHub</text>
      <text y="150"><tspan fill="#f472b6" font-weight="bold">🌱 ESG Research</tspan> — TCS Forage Simulation Alum</text>
      <text y="200"><tspan fill="#60a5fa" font-weight="bold">🎯 Mission</tspan> — Turn data into reliable, clear AI solutions</text>
    </g>
  </g>
</svg>