    <rect width="580" height="450" rx="16" fill="#0d1117" stroke="#2b2313" stroke-width="1.8">
      <animate attributeName="stroke" values="#2b2313;#fbbf24;#2b2313" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="580" height="3" rx="2" fill="url(#goldGrad)"/>
    <text x="35" y="60" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="900" fill="url(#goldGrad)">&lt; What I Build /&gt;</text>
    <line x1="35" y1="80" x2="545" y2="80" stroke="#21262d" stroke-width="1.5"/>
    
      <!-- Row 1 -->
      <g opacity="0">
