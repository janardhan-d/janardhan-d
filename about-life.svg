        <circle cx="35" cy="118" r="5" fill="#fbbf24">
          <animate attributeName="r" values="5;7;5" dur="2s" begin="0.0s" repeatCount="indefinite"/>
        </circle>
        <text x="53" y="123" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#fbbf24">AI &amp; ML Models</text>
        <text x="53" y="143" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#cbd5e1">Generative AI, NLP, predictive analytics &amp; classification</text>
