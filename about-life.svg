        <animate attributeName="opacity" values="0;0;1" dur="1.5s" begin="1.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="15 0;0 0" dur="0.5s" begin="1.2s" fill="freeze"/>
        <circle cx="35" cy="370" r="5" fill="#34d399">
