        <animateTransform attributeName="transform" type="translate" values="15 0;0 0" dur="0.5s" begin="0.3s" fill="freeze"/>
        <circle cx="35" cy="181" r="5" fill="#ffd700">
          <animate attributeName="r" values="5;7;5" dur="2s" begin="0.3s" repeatCount="indefinite"/>
