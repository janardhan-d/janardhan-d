<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a10"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0; 0.5 0; -0.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="20"/>

  <!-- Cyber Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="280" x2="1280" y2="280"/>
    <line x1="0" y1="380" x2="1280" y2="380"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
  </g>

  <!-- Laser Scan Beam -->
  <rect x="0" y="0" width="300" height="560" fill="url(#laser-grad)" opacity="0.4">
    <animate attributeName="x" values="-300; 1280; -300" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Decorative Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" stroke="#22d3ee" stroke-width="3" fill="none" filter="url(#glow)"/>
  <path d="M 1240 70 L 1240 40 L 1210 40" stroke="#22d3ee" stroke-width="3" fill="none" filter="url(#glow)"/>
  <path d="M 40 490 L 40 520 L 70 520" stroke="#22d3ee" stroke-width="3" fill="none" filter="url(#glow)"/>
  <path d="M 1240 490 L 1240 520 L 1210 520" stroke="#22d3ee" stroke-width="3" fill="none" filter="url(#glow)"/>

  <!-- Terminal Window Header -->
  <g transform="translate(60, 60)">
    <rect width="1160" height="440" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="25" cy="22" r="6" fill="#ff5f56"/>
    <circle cx="45" cy="22" r="6" fill="#ffbd2e"/>
    <circle cx="65" cy="22" r="6" fill="#27c93f"/>
    <text x="580" y="26" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#8b949e" text-anchor="middle">janardhan@ai-core: ~ (bash)</text>
    <line x1="0" y1="42" x2="1160" y2="42" stroke="#30363d" stroke-width="1"/>
  </g>

  <!-- Left Side: Terminal Content -->
  <g transform="translate(100, 140)">
    <text x="0" y="0" font-family="ui-monospace, Consolas, monospace" font-size="18" fill="#34d399">janardhan@ai-system:~$ <tspan fill="#e2e8f0">cat profile.json</tspan></text>

    <!-- Glowing Name -->
    <text x="0" y="65" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="url(#name-grad)" filter="url(#glow)">JANARDHAN DEVARALA</text>

    <!-- Cycling Role Titles via SMIL -->
    <g transform="translate(0, 115)">
      <text font-family="ui-monospace, Consolas, monospace" font-size="26" font-weight="bold" fill="#22d3ee">&gt; 
        <tspan fill="#f8fafc">
          <animate attributeName="opacity" values="1;1;0;0;0;0;0;0" keyTimes="0;0.22;0.25;0.5;0.75;0.97;0.98;1" dur="12s" repeatCount="indefinite"/>AI &amp; Machine Learning Engineer
        </tspan>
        <tspan fill="#f8fafc">
          <animate attributeName="opacity" values="0;0;1;1;0;0;0;0" keyTimes="0;0.25;0.28;0.47;0.5;0.75;0.98;1" dur="12s" repeatCount="indefinite"/>Python &amp; Data Analytics Specialist
        </tspan>
        <tspan fill="#f8fafc">
          <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.72;0.75;0.97;0.98;1" dur="12s" repeatCount="indefinite"/>Full-Stack Web Developer
        </tspan>
        <tspan fill="#f8fafc">
          <animate attributeName="opacity" values="0;0;0;0;0;0;1;1" keyTimes="0;0.75;0.78;0.95;0.98;0.99;1;1" dur="12s" repeatCount="indefinite"/>Hackathon Top 5 Builder
        </tspan>
        <tspan fill="#22d3ee">
          <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>_
        </tspan>
      </text>
    </g>

    <!-- Bio Summary -->
    <text x="0" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">B.Tech CSE (AI) Student • TCS Forage Alum • InnoByte &amp; SyntecxHub Intern</text>

    <!-- Status Badge -->
    <g transform="translate(0, 205)">
      <rect width="260" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="20" cy="17" r="5" fill="#10b981">
        <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="35" y="22" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#34d399">OPEN FOR OPPORTUNITIES</text>
    </g>
  </g>

  <!-- Right Side: Code Snippet Card -->
  <g transform="translate(730, 140)">
    <rect width="450" height="260" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <g transform="translate(24, 35)" font-family="ui-monospace, Consolas, monospace" font-size="14">
      <text y="0" fill="#f472b6">@ai_engine.pipeline</text>
      <text y="28" fill="#a78bfa">def <tspan fill="#60a5fa">innovate_and_build</tspan><tspan fill="#e2e8f0">():</tspan></text>
      <text y="56" fill="#94a3b8">&nbsp;&nbsp;&nbsp;&nbsp;skills = [<tspan fill="#34d399">"AI"</tspan>, <tspan fill="#34d399">"Python"</tspan>, <tspan fill="#34d399">"Data"</tspan>]</text>
      <text y="84" fill="#94a3b8">&nbsp;&nbsp;&nbsp;&nbsp;model = GenAI.train(data=insights)</text>
      <text y="112" fill="#f472b6">&nbsp;&nbsp;&nbsp;&nbsp;return <tspan fill="#e2e8f0">model.deploy(</tspan></text>
      <text y="140" fill="#e2e8f0">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;impact=<tspan fill="#34d399">"MAXIMUM"</tspan>,</text>
      <text y="168" fill="#e2e8f0">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;status=<tspan fill="#34d399">"SHIPPED"</tspan></text>
      <text y="196" fill="#e2e8f0">&nbsp;&nbsp;&nbsp;&nbsp;)</text>
    </g>
  </g>
</svg>