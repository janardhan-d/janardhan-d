  </defs>

  <rect width="1280" height="380" fill="url(#tbg)" rx="20"/>

  <rect x="0" y="0" width="1280" height="4" rx="2" fill="url(#tTitleGold)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>

